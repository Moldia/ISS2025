name: iss_postprocessing
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11
  - cudatoolkit=11.8        # CUDA runtime (for GPU support)
  - cudnn=8.9               # cuDNN runtime (for GPU support)
  - pip
  - pip:
      - "numpy<2"           # StarDist & TF2.15 not yet compatible with NumPy 2.x
      - scanpy
      - squidpy
      - anndata
      - python-igraph       # needed for Leiden clustering in Scanpy
      - torch
      - "tensorflow==2.15"  # last TF release for CUDA 11.x
      - stardist
      - cellpose
      - pciseq
      - tangram-sc
      - scikit-image
      - tifffile
      - matplotlib
      - seaborn
      - pandas
      - scipy
      - scikit-learn
      - opencv-python
      - imageio
      - diplib
      - matplotlib-scalebar
      - jupyter
      - ipykernel
      - .                   # install your own package (non-editable)
