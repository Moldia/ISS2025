name: iss_postprocessing
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11
  - pip
  # GPU + core deps
  - cudatoolkit=11.8
  - cudnn=8.9
  # scientific python stack (stable builds from conda-forge)
  - numpy=1.26
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scikit-image
  - tifffile
  - jupyter
  - ipykernel
  # spatial & clustering
  - scanpy
  - squidpy
  - anndata
  - python-igraph        # required for Leiden clustering
  # deep learning frameworks (CUDA 11.x compatible)
  - pytorch              # from conda-forge/nvidia
  - tensorflow=2.15
  # pip-only packages (pure Python / niche ISS tools)
  - pip:
      - pciseq
      - tangram-sc
      - stardist
      - cellpose
      - opencv-python
      - imageio
      - diplib
      - matplotlib-scalebar
      - . # package in non-editable mode
