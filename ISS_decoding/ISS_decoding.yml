name: ISS_decoding
channels:
  - conda-forge
dependencies:
  # Python & core
  - python=3.11
  - pip
  - setuptools<81
  - wheel

  # Arrays / data
  - numpy>=1.26,<2
  - pandas
  # PyArrow 26 requires NumPy 2; Starfish still needs the NumPy 1.x stack.
  - pyarrow>=10,<26

  # Imaging & plotting
  - scikit-image
  - matplotlib=3.7.3
  - tifffile

  # Jupyter (optional but handy)
  - notebook
  - jupyterlab
  - ipywidgets
  - ipykernel

  # Optional: xarray is used under the hood by starfish; include explicitly to be safe
  - xarray

  # (If you need progress bars etc., uncomment)
  # - tqdm

  # Everything else via pip
  - pip:
      # Starfish & friends
      - starfish==0.3.3
      - slicedimage
      - read-roi
      - regional
      - showit

      # Install the current project with all optional decoding integrations
      - ".[postcode,spotiflow,istdeco,bardensr,graphiss]"
