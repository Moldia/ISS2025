[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ISS_preprocessing"
version = "0.1.0"
description = "Image preprocessing pipeline for ISS microscopy"
readme = "README.md"
authors = [{name = "Christoffer Mattsson Langseth", email = "christoffer.langseth@scilifelab.se"}]
requires-python = ">=3.9"
keywords = ["python", "spatial transcriptomics", "spatially resolved transcriptomics", "in situ sequencing", "ISS", "decoding"]
dependencies = [
    "numpy",
    "scipy",
    "tifffile",
    "PyYAML"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
