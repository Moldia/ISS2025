name: ISS_preprocessing
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9
  - numpy=1.23
  - pandas=2.3
  - scipy=1.13
  - tifffile
  - dask-core
  - aicspylibczi
  - pip
  # Jupyter + kernel
  - ipykernel
  - jupyterlab
  - notebook
  # Optional GPU (comment out if not needed)
  - cudatoolkit=11.2
  - cudnn=8.1.0
  - pip:
      - opencv-python-headless>=4.8
      - tqdm
      - natsort
      - readlif
      - RedLionfish
      - ashlar
      - -e ./ISS_preprocessing    # editable install for local dev
